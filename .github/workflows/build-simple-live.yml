name: build-simple-live

# 手动触发（workflow_dispatch 只认默认分支上的工作流文件）。
# 文件放在 master，就构建 master 的代码；checkout 默认跟随触发分支，不用写 ref。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-simple-live
  cancel-in-progress: true

jobs:
  # ───────────────────────── Android APK ─────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
            ndk;28.2.13676358

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 版本跟随仓库里的 .fvmrc（master 上是 3.38.3），不用手改
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: 配置 JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      # 上游 release 构建需要签名，否则产出的 APK 是 unsigned，装不上。
      # 这里现场生成一个自用证书，省掉配置 secrets。
      - name: 生成自签名证书
        working-directory: simple_live_app/android
        run: |
          keytool -genkeypair -v -keystore self.keystore \
            -storepass android -alias selfkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SimpleLive, O=Self, C=CN"
          printf 'storeFile=../self.keystore\nstorePassword=android\nkeyPassword=android\nkeyAlias=selfkey\n' > key.properties

      - name: 锁定 4 个 Gradle 脚本损坏的依赖
        # 2026-10 这批新版本（auto_orientation_v2 2.4.x / dynamic_color 1.9.0 /
        # qr_code_scanner_plus 2.2.0+ / volume_controller 3.6.0+）在 android 脚本里
        # 写了 kotlin{} 却没 apply Kotlin 插件，assembleRelease 直接失败。
        # auto_orientation_v2 2.4.x 的源码是 Kotlin（插件永远不会被编译），
        # 退到 2.3.6 —— 纯 Java 实现，Dart API 完全一致。
        run: |
          cat >> simple_live_app/pubspec.yaml <<'EOF'

          dependency_overrides:
            auto_orientation_v2: 2.3.6
            dynamic_color: 1.8.1
            qr_code_scanner_plus: 2.1.2
            volume_controller: 3.5.0
          EOF

      - name: flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: 编译 APK
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v7
        with:
          name: simple-live-android
          if-no-files-found: error
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

  # ───────────────────────── Windows 免安装包 ─────────────────────────
  windows:
    name: Windows 免安装版
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: 编译 Windows
        working-directory: simple_live_app
        run: flutter build windows --release

      - name: 打包 zip
        shell: pwsh
        working-directory: simple_live_app
        run: |
          $exe = Get-ChildItem build\windows -Recurse -Filter simple_live_app.exe | Select-Object -First 1
          if (-not $exe) { throw "找不到 simple_live_app.exe" }
          $rel = $exe.Directory
          "打包目录: $($rel.FullName)"
          $zip = Join-Path (Resolve-Path "build").Path "simple-live-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($rel.FullName, $zip)
          $size = (Get-Item $zip).Length
          "zip 大小: {0:N1} MB" -f ($size / 1MB)
          if ($size -lt 5MB) { throw "zip 太小（$size 字节），打包目录选错了" }
          Get-ChildItem $rel.FullName | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: simple-live-windows
          if-no-files-found: error
          path: simple_live_app/build/simple-live-windows.zip
